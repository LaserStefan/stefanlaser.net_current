<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Stefan Laser · CMS</title>
    <style>
      /* Small additions to Sveltia's editor. They hook into the field attributes Sveltia sets
         (data-key-path, data-field-type). If an update changes those, the CMS simply looks
         like plain Sveltia again; nothing breaks. */
      :root {
        --sl-group: #f2f6f3;
        --sl-group-line: #d3e1d8;
        --sl-switch: #e7f0ea;
      }
      @media (prefers-color-scheme: dark) {
        :root { --sl-group: #1f2623; --sl-group-line: #334039; --sl-switch: #24302a; }
      }

      /* the three switches at the top, side by side */
      :has(> .field[data-key-path="blog"]) { display: flex; flex-wrap: wrap; column-gap: 10px; }
      :has(> .field[data-key-path="blog"]) > * { flex: 1 1 100%; min-width: 0; }
      .field:is([data-key-path="blog"], [data-key-path="research"], [data-key-path="draft"]) {
        flex: 1 1 28% !important;
        background: var(--sl-switch);
        border-radius: 6px;
        padding: 6px 12px !important;
        margin-bottom: 8px;
      }

      /* groups: a light tint so Social media and Posted to stand apart from the writing */
      .field[data-field-type="object"],
      .field[data-key-path="crosspost.thread"] {
        background: var(--sl-group);
        border: 1px solid var(--sl-group-line);
        border-radius: 6px;
        padding: 10px 14px !important;
        margin: 14px 0;
      }
      .field[data-field-type="object"] .field[data-field-type="object"],
      .field[data-field-type="object"] .field[data-key-path="crosspost.thread"] {
        background: transparent;
      }

      /* the writing field: roomy, and it can be dragged larger at the bottom right corner */
      .field[data-key-path="body"] [contenteditable="true"],
      .field[data-key-path="body"] textarea {
        min-height: 42vh;
        resize: vertical;
        overflow: auto;
        font-size: 1.05rem;
        line-height: 1.65;
      }
      @media (max-width: 700px) {
        .field[data-key-path="body"] [contenteditable="true"],
        .field[data-key-path="body"] textarea { min-height: 30vh; }
      }
      /* character count under the writing field (script below) */
      .sl-count {
        position: sticky; bottom: 0; z-index: 2;
        margin-top: 6px; padding: 4px 10px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        background: var(--sl-switch); border-radius: 4px; opacity: .95;
      }
      .sl-count b { font-weight: 600; }
      .sl-count .over { color: #b4532a; }
    </style>
  </head>
  <body>
    <script>
      // Live character count for the text of an entry, as Bluesky (300) and Mastodon (500)
      // will roughly see it: markup, image tags and link addresses don't count.
      (function () {
        const seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter("en", { granularity: "grapheme" }) : null;
        const len = (t) => (seg ? [...seg.segment(t)].length : [...t].length);
        const plainFromMarkdown = (md) => md
          .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
          .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
          .replace(/^#{1,6}\s+/gm, "").replace(/^>\s?/gm, "").replace(/(\*\*|__|\*|_|`)/g, "");
        const parts = (n, limit) => (n <= limit ? "1 post" : `~${Math.ceil(n / (limit - 8))} posts`);
        function update() {
          const field = document.querySelector('.field[data-key-path="body"]');
          if (!field) return;
          // only under Write: projects, pages and the archive are never posted
          if (!/\/collections\/notes(\/|$)/.test(location.hash)) {
            const old = field.querySelector(".sl-count");
            if (old) old.remove();
            return;
          }
          const ed = field.querySelector('[contenteditable="true"]');
          const ta = field.querySelector("textarea");
          let text = "";
          if (ta && ta.offsetParent !== null) text = plainFromMarkdown(ta.value);
          else if (ed) text = ed.innerText;
          text = text.replace(/\n{3,}/g, "\n\n").trim();
          let box = field.querySelector(".sl-count");
          if (!box) {
            box = document.createElement("div");
            box.className = "sl-count";
            box.setAttribute("aria-live", "polite");
            field.appendChild(box);
          }
          const n = len(text);
          const html = `<b>${n}</b> characters · Bluesky <span class="${n > 300 ? "over" : ""}">${parts(n, 300)}</span>` +
            ` · Mastodon <span class="${n > 500 ? "over" : ""}">${parts(n, 500)}</span>`;
          if (box.innerHTML !== html) box.innerHTML = html;
        }
        setInterval(update, 400);
      })();
    </script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
