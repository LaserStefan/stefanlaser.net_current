# Sveltia CMS configuration for stefanlaser.net
# Docs: https://github.com/sveltia/sveltia-cms
#
# ONE THING TO FILL IN after setting up the login helper (see SETUP.md, step 3):
#   backend.base_url  ->  the address of your sveltia-cms-auth Cloudflare Worker

backend:
  name: github
  repo: LaserStefan/stefanlaser.net_Cloudflare
  branch: main
  base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://stefanlaser.net
display_url: https://stefanlaser.net

# Uploads go to assets/uploads so Hugo can resize and dither them.
media_folder: assets/uploads
public_folder: /uploads

# Shrink photos in the browser before upload (low-carbon: no 6 MB phone pictures in the repo).
media_libraries:
  default:
    config:
      max_file_size: 20000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# ---------------------------------------------------------------------------
collections:
  - name: notes
    label: Notes
    label_singular: Note
    description: >-
      Short posts without a title, like on Micro.blog. Text for LinkedIn, ready to copy:
      /admin/share/
    folder: content/notes
    path: "{{year}}/{{month}}/{{day}}/{{hour}}{{minute}}"
    create: true
    format: yaml-frontmatter
    extension: md
    identifier_field: date
    summary: "{{date | date('YYYY-MM-DD')}} · {{body | truncate(80)}}"
    sortable_fields:
      fields: [date]
      default: { field: date, direction: descending }
    fields:
      - { label: Text, name: body, widget: markdown, buttons: [bold, italic, link, quote, bulleted-list, numbered-list], editor_components: [image] }
      - { label: Date, name: date, widget: datetime, picker_utc: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: Drafts are not published or cross-posted. }
      - &crosspost
        label: Cross-posting
        name: crosspost
        widget: object
        collapsed: true
        required: false
        hint: >-
          Runs once, right after the post is live on the site. Old posts are never sent.
          Untick a platform to skip it for this post.
        fields:
          - { label: Bluesky, name: bluesky, widget: boolean, default: true }
          - { label: Mastodon, name: mastodon, widget: boolean, default: true }
          - { label: "LinkedIn (automatic, only with a LinkedIn token)", name: linkedin, widget: boolean, default: false, hint: "Without a token: copy the text from stefanlaser.net/admin/share/ instead." }
          - label: Short text for social media
            name: text
            widget: text
            required: false
            maxlength: 300
            hint: >-
              Optional. Replaces the automatic text (title + start of the post). Max 300
              characters, the Bluesky limit. A link to the post is added automatically.
          - label: Bluesky thread
            name: thread
            widget: list
            required: false
            field: { label: Post, name: post, widget: text, maxlength: 300 }
            hint: >-
              Optional. Each entry becomes one post in a Bluesky reply chain (max 300 characters each).
              If filled, it replaces the short text on Bluesky.
          - { label: Use the thread on Mastodon too, name: thread_mastodon, widget: boolean, default: true }
          - label: Where the link goes
            name: link_position
            widget: select
            default: end
            options:
              - { label: "In the last post", value: end }
              - { label: "In the first post", value: start }
              - { label: "No link", value: none }
          - label: Image for social media
            name: image
            widget: image
            required: false
            hint: Optional. Otherwise the first images of the post are attached (up to 4).
          - { label: Image description (alt text), name: image_alt, widget: string, required: false }
      - &syndication
        label: Posted to (filled in automatically)
        name: syndication
        widget: object
        collapsed: true
        required: false
        hint: Links to the copies on social media. Written by the cross-posting job; leave as is.
        fields:
          - { label: Bluesky, name: bluesky, widget: string, required: false }
          - { label: Mastodon, name: mastodon, widget: string, required: false }
          - { label: LinkedIn, name: linkedin, widget: string, required: false }
      - &old_url
        label: Old address
        name: url
        widget: string
        required: false
        readonly: true
        hint: Address from the Micro.blog days. Keeps old links working; don't change it.

  - name: posts
    label: Blog posts
    label_singular: Blog post
    description: >-
      Long-form posts with a title. Shown in the Blog row on the homepage and on /posts/,
      and also in the Notes stream. Research projects go into Projects instead.
      Text for LinkedIn, ready to copy: /admin/share/
    folder: content/posts
    path: "{{year}}/{{slug}}"
    create: true
    format: yaml-frontmatter
    extension: md
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, picker_utc: false }
      - { label: Summary, name: summary, widget: text, required: false, hint: "Optional teaser for cards and feeds. Otherwise the text up to <!--more--> or the first lines are used." }
      - { label: Text, name: body, widget: markdown }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - *crosspost
      - *syndication
      - *old_url

  - name: projects
    label: Projects
    label_singular: Project
    description: Research projects for the portfolio. Order them with "Position".
    folder: content/projects
    path: "{{slug}}/index"
    create: true
    format: yaml-frontmatter
    extension: md
    summary: "{{weight}} · {{title}} ({{phase}})"
    sortable_fields:
      fields: [weight, title]
      default: { field: weight, direction: ascending }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short summary, name: summary, widget: text, hint: Shown at the top of the project page and in the overview. }
      - { label: Project website, name: project_website, widget: string, required: false, hint: "Full address, e.g. https://… Shown next to the summary in the overview and at the top of the project page." }
      - { label: Button text, name: project_website_label, widget: string, required: false, hint: "Defaults to “Project website”." }
      - { label: Theme label, name: phase, widget: string, required: false, hint: "Small label above the title in the overview, e.g. “current”, “waste” or “data centres and semiconductors”." }
      - { label: Years, name: years, widget: string, required: false, hint: "e.g. 2022–today" }
      - { label: Position, name: weight, widget: number, value_type: int, default: 100, hint: "Lower numbers appear higher in the overview (10, 20, 30 … leaves room in between)." }
      - label: Featured publications (up to 5)
        name: featured_publications
        widget: list
        max: 5
        required: false
        summary: "{{fields.title}}{{fields.pub}}"
        hint: Shown next to the project and on its page, in this order. Drag to reorder.
        fields:
          - label: Publication
            name: pub
            widget: relation
            collection: publications
            value_field: "{{slug}}"
            search_fields: [title, year, citation]
            display_fields: ["{{year}} · {{title}}"]
            required: false
            hint: Type a word from the title to search.
          - { label: Own title, name: title, widget: string, required: false, hint: "Optional. Replaces the title for this project only. Also lets you add something that is not in the list." }
          - { label: Own link, name: link, widget: string, required: false, hint: "Optional. https://… replaces the DOI or publisher link." }
          - { label: Short note, name: note, widget: string, required: false, hint: "Optional, e.g. “open access” or “with Estrid Sørensen”." }
      - { label: Image, name: thumbnail, widget: image, required: false, hint: Shown in the overview frame. If empty, the first image in the text is used. }
      - { label: Image description (alt text), name: thumbnail_alt, widget: string, required: false }
      - { label: Text, name: body, widget: markdown }
      - { label: Date, name: date, widget: datetime, required: false }
      - { label: Old address, name: old_url, widget: string, required: false, readonly: true }
      - { label: Tags, name: tags, widget: list, required: false }

  - name: publications
    label: Publications
    label_singular: Publication
    description: >-
      Filled automatically from the publication list in your CV (Pages → CV) and from ORCID.
      To change a publication, edit it in the CV; this list follows on the next build.
      Add an entry here only for something that is in neither.
    folder: content/publications/items
    path: "{{slug}}"
    create: true
    format: yaml-frontmatter
    extension: md
    summary: "{{year}} · {{title}} ({{source}})"
    sortable_fields:
      fields: [sort, year, title]
      default: { field: sort, direction: ascending }
    view_filters:
      - { label: From the CV, field: source, pattern: "^cv$" }
      - { label: Only in ORCID, field: source, pattern: "^orcid$" }
      - { label: Added by hand, field: source, pattern: "^manual$" }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Year, name: year, widget: string, required: false }
      - label: Type
        name: pub_type
        widget: select
        required: false
        options: [Monograph, Special issue, Edited volume, Journal article, Article / chapter, Review, Interview, Report / working paper, Other]
      - { label: Full citation, name: citation, widget: text, required: false, hint: "Shown on the publications page exactly as written." }
      - { label: Link, name: link, widget: string, required: false }
      - { label: DOI, name: doi, widget: string, required: false }
      - { label: Source, name: source, widget: hidden, default: manual }
      - { label: Order, name: sort, widget: hidden, default: 5000 }

  - name: pages
    label: Pages
    files:
      - name: cv
        label: CV
        file: content/cv.md
        fields:
          - { label: Title, name: title, widget: string }
          - *old_url
          - label: Text
            name: body
            widget: markdown
            modes: [raw, rich_text]
            hint: >-
              Opens as plain Markdown so pasted text keeps its formatting. The publication list
              (under "## List of Publications", one "- " line per item, grouped by "###" headings)
              also feeds the Publications page.
      - name: socials
        label: Socials
        file: content/socials.md
        fields:
          - { label: Title, name: title, widget: string }
          - *old_url
          - { label: Text, name: body, widget: markdown, modes: [raw, rich_text] }
      - name: impressum
        label: Impressum / Legal notice
        file: content/impressum.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Text, name: body, widget: markdown, modes: [raw, rich_text], hint: "German first, English below. Keep the {#…} marks after the headings: the footer links jump there." }
      - name: projects_intro
        label: Projects overview (intro text)
        file: content/projects/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: body, widget: markdown, required: false }
      - name: photos_intro
        label: Photos page (intro text)
        file: content/photos/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: body, widget: markdown, required: false }
      - name: blog_intro
        label: Blog page (intro text)
        file: content/posts/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: body, widget: markdown, required: false }
      - name: notes_intro
        label: Notes page (intro text)
        file: content/notes/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: body, widget: markdown, required: false }

  - name: settings
    label: Site settings
    editor:
      preview: false
    files:
      - name: site
        label: Menu, homepage, micro stream and design
        file: data/site.yaml
        format: yaml
        fields:
          - label: Menu
            name: nav
            widget: list
            summary: "{{name}}: {{url}}"
            hint: Drag to reorder.
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Link, name: url, widget: string, hint: "/notes/ for pages on this site, https://… for external links" }

          - label: Homepage
            name: hero
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - { label: Short description (about), name: bio, widget: text, required: false }
              - { label: Photo, name: image, widget: image, required: false, hint: Portrait works best. Gets dithered too if dithering is on. }
              - { label: Photo description (alt text), name: image_alt, widget: string, required: false }
              - label: Links next to the icons
                name: links
                widget: list
                summary: "{{label}}"
                fields:
                  - { label: Text, name: label, widget: string }
                  - { label: Link, name: url, widget: string }

          - label: Social icons
            name: social
            widget: list
            summary: "{{platform}}: {{url}}"
            hint: Icons below the description. Empty links are hidden.
            fields:
              - { label: Platform, name: platform, widget: select, options: [bluesky, mastodon, linkedin, orcid, github, email, rss, other] }
              - { label: Link, name: url, widget: string, required: false }

          - label: Homepage sections
            name: home
            widget: object
            fields:
              - { label: Blog row title, name: blog_title, widget: string }
              - { label: Number of blog posts, name: blog_count, widget: number, value_type: int, min: 0, max: 9 }
              - { label: Photos row title, name: photos_title, widget: string }
              - { label: Number of photos, name: photos_count, widget: number, value_type: int, min: 0, max: 12, hint: "4 fills one row." }
              - { label: Publications row title, name: publications_title, widget: string }
              - { label: Number of publications, name: publications_count, widget: number, value_type: int, min: 0, max: 9 }

          - label: Publications
            name: publications
            widget: object
            fields:
              - { label: ORCID iD, name: orcid, widget: string, required: false, hint: "e.g. 0000-0002-6782-3496. Your public ORCID works are listed automatically. Leave empty to show only the entries from the Publications collection." }
              - { label: Intro text, name: intro, widget: text, required: false }

          - label: Micro stream (right column)
            name: stream
            widget: object
            hint: Refreshed every three hours and whenever you publish.
            fields:
              - { label: Show the box, name: enabled, widget: boolean, default: true }
              - label: Source
                name: source
                widget: select
                default: mastodon
                options:
                  - { label: Bluesky, value: bluesky }
                  - { label: Mastodon, value: mastodon }
              - { label: Box title, name: title, widget: string }
              - { label: Number of posts, name: count, widget: number, value_type: int, min: 1, max: 15 }
              - { label: Bluesky handle, name: bluesky_handle, widget: string, required: false, hint: "e.g. stefanlaser.net or stefanlaser.bsky.social" }
              - { label: Mastodon server, name: mastodon_instance, widget: string, required: false, hint: "e.g. social.tchncs.de" }
              - { label: Mastodon username, name: mastodon_user, widget: string, required: false, hint: "without the server, e.g. stefanlaser" }
              - { label: Hide replies, name: hide_replies, widget: boolean, default: true }
              - { label: Hide reposts / boosts, name: hide_reposts, widget: boolean, default: true }

          - label: Design
            name: design
            widget: object
            fields:
              - { label: Accent colour, name: accent, widget: color, hint: Frame of the micro box, link underlines, labels. }
              - { label: Accent background, name: accent_soft, widget: color, hint: Fill of the micro box and highlighted publications. }
              - { label: Accent colour (dark mode), name: accent_dark, widget: color }
              - { label: Accent background (dark mode), name: accent_soft_dark, widget: color }
              - { label: Page background, name: paper, widget: color }
              - { label: Page background (dark mode), name: paper_dark, widget: color }
              - { label: Tab icon, name: favicon, widget: image, required: false, hint: "Small icon in the browser tab. Empty = the homepage photo. A simple, high-contrast picture works best." }
              - { label: Serif headings, name: serif_headings, widget: boolean, default: true }
              - { label: Dither images, name: dither_images, widget: boolean, default: true, hint: "Click on an image shows it in colour. Off = normal WebP images." }
              - label: Dither style
                name: dither_mode
                widget: select
                default: rotate
                options:
                  - { label: "Two colours, one accent per image (light, ~15 KB)", value: rotate }
                  - { label: "Full palette in every image (colourful, ~75 KB)", value: palette }
              - { label: Ink (dark colour), name: dither_ink, widget: color, hint: "Two-colour style: the dark half of every image." }
              - label: Accent colours (one per image)
                name: dither_colours
                widget: list
                field: { label: Colour, name: colour, widget: color }
                hint: "Two-colour style: each image gets one of these, always the same one. Light, soft colours work best against the dark ink."
              - label: Full palette
                name: dither_palette
                widget: list
                field: { label: Colour, name: colour, widget: color }
                hint: "Only for the full-palette style. Include one very dark and one very light colour."
              - { label: Brighten before dithering, name: dither_gamma, widget: number, value_type: float, min: 0.6, max: 2, step: 0.05, default: 1.25, hint: "1 = unchanged. Higher keeps dark photos readable." }
              - label: Dither pattern
                name: dither_method
                widget: select
                default: Atkinson
                options:
                  - { label: "Atkinson (classic Mac, clean)", value: Atkinson }
                  - { label: "Floyd–Steinberg (fine grain)", value: FloydSteinberg }
                  - { label: "Clustered dots (print, newspaper)", value: ClusteredDot4x4 }
                  - { label: "Diagonal dots (screen print)", value: ClusteredDotDiagonal8x8 }
              - { label: Image width in posts (px), name: image_width, widget: number, value_type: int, min: 320, max: 1200 }
              - label: Extra CSS
                name: extra_css
                widget: code
                default_language: css
                allow_language_selection: false
                output_code_only: true
                required: false
                hint: For small tweaks only. A typo here can break the layout, so test on the preview branch first.

          - { label: Footer text, name: footer_text, widget: string, required: false }
