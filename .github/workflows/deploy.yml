name: Build, deploy and cross-post

on:
  push:
    branches: ["**"]          # main = live site, any other branch = preview address
  schedule:
    - cron: "23 */3 * * *"    # refresh the micro stream every 3 hours (times are UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Cross-posting: only show what would be posted"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  HUGO_VERSION: "0.169.0"
  CF_PROJECT: stefanlaser-net
  SITE_URL: https://stefanlaser.net
  # set the repository variable CLOUDFLARE_PAGES to "off" to stop deploying there
  CF_ENABLED: ${{ vars.CLOUDFLARE_PAGES != 'off' }}

jobs:
  site:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pagesout.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -xzf /tmp/hugo.tgz -C /usr/local/bin hugo
          hugo version

      - name: Reuse processed images from earlier runs
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-gen-${{ hashFiles('layouts/_partials/img.html', 'data/site.yaml') }}-${{ github.run_id }}
          restore-keys: |
            hugo-gen-${{ hashFiles('layouts/_partials/img.html', 'data/site.yaml') }}-
            hugo-gen-

      - name: Publications from CV and ORCID
        run: |
          pip install --quiet pillow pyyaml
          python3 scripts/sync_publications.py
          if [ "${GITHUB_REF_NAME}" = "main" ] && [ -n "$(git status --porcelain content/publications data/publications_status.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/publications data/publications_status.yaml
            git commit -q -m "Update publications from CV and ORCID [skip ci]"
            git pull -q --rebase --autostash && git push -q || echo "::warning::Could not save the publication list; it is rebuilt on the next run."
          fi

      - name: Build
        run: |
          set -o pipefail
          hugo --gc --minify ${{ github.ref_name != 'main' && format('--baseURL https://{0}.{1}.pages.dev/', github.ref_name, env.CF_PROJECT) || '' }} 2>&1 | tee build.log
          # surface problems with the micro stream as visible notes on the run
          grep -iE "stream|lookup" build.log | sed 's/^/::warning title=Micro stream::/' || true
          for u in "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=stefanlaser.bsky.social&limit=1" "https://social.tchncs.de/api/v1/accounts/lookup?acct=stefanlaser"; do
            echo "::notice title=Stream check::$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$u") $u"
          done

      - name: Shrink dithered images
        run: python3 scripts/shrink_dithered.py public

      # ---------------- GitHub Pages ----------------
      - name: Look up the GitHub Pages address
        id: pages
        if: github.ref_name == 'main'
        continue-on-error: true   # fails until Pages is switched on (Settings → Pages → GitHub Actions)
        uses: actions/configure-pages@v5

      - name: Build for GitHub Pages
        id: pagesout
        if: github.ref_name == 'main' && steps.pages.outcome == 'success'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          echo "GitHub Pages address: $PAGES_URL"
          if [ "${PAGES_URL%/}" = "${SITE_URL%/}" ]; then
            # custom domain is set: the normal build is exactly right
            cp -r public public-pages
          else
            # no custom domain yet: the site lives in a sub-folder of github.io
            hugo --minify --baseURL "${PAGES_URL%/}/" -d public-pages
            python3 scripts/shrink_dithered.py public-pages
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Hand the site to GitHub Pages
        if: steps.pagesout.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-pages

      # ---------------- Cloudflare Pages ----------------
      - name: Deploy to Cloudflare Pages
        if: env.CF_ENABLED == 'true'
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # strip stray spaces or line breaks that sneak in when pasting secrets
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]')"
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy public --project-name="$CF_PROJECT" --branch="${GITHUB_REF_NAME}" --commit-dirty=true

      # ---------------- cross-posting (live site only) ----------------
      - name: Install cross-posting tools
        if: github.ref_name == 'main'
        working-directory: scripts/crosspost
        run: npm ci --no-audit --no-fund

      - name: Cross-post new posts
        id: crosspost
        if: github.ref_name == 'main'
        continue-on-error: true
        working-directory: scripts/crosspost
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: node crosspost.mjs

      - name: Save links to the social posts
        if: github.ref_name == 'main'
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Record cross-post links [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: LinkedIn token reminder
        if: github.ref_name == 'main' && vars.LINKEDIN_TOKEN_DATE != ''
        run: |
          age=$(( ( $(date +%s) - $(date -d "${{ vars.LINKEDIN_TOKEN_DATE }}" +%s) ) / 86400 ))
          if [ "$age" -ge 50 ]; then
            echo "::warning::The LinkedIn token is $age days old and expires after about 60 days. Create a new one (see SETUP.md) and update LINKEDIN_TOKEN and LINKEDIN_TOKEN_DATE."
          fi

      - name: Report cross-posting problems
        if: steps.crosspost.outcome == 'failure'
        run: |
          echo "::error::At least one cross-post failed. See the 'Cross-post new posts' step above. The other platforms were posted and recorded; the failed one is retried on the next run."
          exit 1

  pages:
    needs: site
    if: github.ref_name == 'main' && needs.site.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
