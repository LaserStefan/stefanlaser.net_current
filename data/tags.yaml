# Hashtag clean-up for the notes graph. The notes themselves are not changed.
#
# merge:  hashtags that mean the same thing (plural, German/English, typo).
#         The first name is the one shown.
# ignore: hashtags that say nothing about the topic.
# themes: groups for the colours in the graph, named after your own hashtags.
#         A hashtag can only be in one theme. Places and events have no theme
#         and stay neutral.

