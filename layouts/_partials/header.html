{{- $s := hugo.Data.site }}
<header class="header">
  <nav class="header-nav">
    <div class="logo">
      <a href="{{ "" | absURL }}" accesskey="h" title="{{ site.Title }} (Alt + H)">{{ $s.hero.name | default site.Title }}</a>
      <div class="logo-switches">
        <button id="theme-toggle" class="theme-toggle" accesskey="t" title="Toggle theme (Alt + T)" aria-label="Toggle theme">
          <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
        <a class="search-link" href="{{ "search/" | relURL }}" accesskey="/" title="Search (Alt + /)" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="15.5" y1="15.5" x2="21" y2="21"></line></svg>
        </a>
      </div>
    </div>
    <ul id="menu" class="menu">
      {{- $here := .RelPermalink }}
      {{- range $s.nav }}
      {{- $ext := hasPrefix .url "http" }}
      <li>
        <a href="{{ .url | relURL }}"{{ if $ext }} target="_blank" rel="noopener"{{ end }}>
          <span{{ if and (not $ext) (ne .url "/") (hasPrefix $here .url) }} class="active" aria-current="page"{{ end }}>{{ .name }}</span>{{ if $ext }}<sup class="ext">ext</sup>{{ end }}
        </a>
      </li>
      {{- end }}
    </ul>
  </nav>
</header>
