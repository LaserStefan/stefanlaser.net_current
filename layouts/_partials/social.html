{{- $links := where . "url" "!=" "" -}}
{{- with $links }}
<ul class="social">
  {{- range . }}
  {{- $url := .url }}
  {{- if eq .platform "email" }}{{ if not (hasPrefix $url "mailto:") }}{{ $url = printf "mailto:%s" $url }}{{ end }}{{ end }}
  <li><a href="{{ $url | relURL }}" title="{{ .platform | title }}" aria-label="{{ .platform | title }}"{{ if eq .platform "mastodon" }} rel="me"{{ end }}>{{ partial "icon.html" .platform }}</a></li>
  {{- end }}
</ul>
{{- end }}
