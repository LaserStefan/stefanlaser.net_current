{{- $d := hugo.Data.site.design -}}
{{- partialCached "favicon.html" . "favicon" -}}
{{- partialCached "redirects.html" . "redirects" -}}
<style>
:root {
  --accent: {{ $d.accent | default "#5e8b72" | safeCSS }};
  --accent-soft: {{ $d.accent_soft | default "#eef4f0" | safeCSS }};
  --paper: {{ $d.paper | default "#f7f6f2" | safeCSS }};
}
:root[data-theme="dark"] {
  --accent: {{ $d.accent_dark | default "#8fbfa3" | safeCSS }};
  --accent-soft: {{ $d.accent_soft_dark | default "#1d2722" | safeCSS }};
  --paper: {{ $d.paper_dark | default "#1b1c1e" | safeCSS }};
}
{{- if not $d.serif_headings }}
:root { --font-display: var(--font-sans); }
{{- end }}
{{ with $d.extra_css }}{{ . | safeCSS }}{{ end }}
</style>
{{- with site.Home.OutputFormats.Get "JSONFeed" }}
<link rel="alternate" type="application/feed+json" href="{{ .RelPermalink }}" title="{{ site.Title }}">
{{- end }}
<meta name="robots" content="noai, noimageai">
{{- with hugo.Data.site.analytics }}{{ with .goatcounter }}
<script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{{- end }}{{ end }}
